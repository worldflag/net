<svg width="460" height="96" viewBox="0 0 460 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WorldFlags logo">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- icon mark -->
  <g>
    <rect x="8" y="8" width="80" height="80" rx="16"
          fill="none" stroke="#39ff14" stroke-width="4" filter="url(#glow)"/>
    <line x1="78" y1="26" x2="86" y2="26" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="48" x2="86" y2="48" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="70" x2="86" y2="70" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="18" x2="32" y2="80" stroke="#eef1ea" stroke-width="4" stroke-linecap="round"/>
    <polygon points="32,22 72,36 32,50" fill="#39ff14" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="112" y="58" font-family="'Big Shoulders Display', 'Arial Narrow', sans-serif"
        font-weight="800" font-size="40" letter-spacing="0" fill="#eef1ea">WORLD<tspan fill="#39ff14" filter="url(#glow)">FLAGS</tspan></text>
  <text x="113" y="80" font-family="'IBM Plex Mono', monospace" font-size="11"
        letter-spacing="2" fill="#5c6659">GLOBAL VEXILLOLOGY ARCHIVE</text>
</svg>
